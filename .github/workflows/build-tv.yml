name: Compila e verifica app Android TV
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-tv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.4.1'
      - name: Compila APK di prova e controlla il progetto
        run: gradle -p android-tv --no-daemon assembleDebug lint test
      - uses: actions/upload-artifact@v4
        with:
          name: GestioneTurniTV-1.1.0-prova
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Controlli-Android-TV
          path: |
            android-tv/app/build/reports/
